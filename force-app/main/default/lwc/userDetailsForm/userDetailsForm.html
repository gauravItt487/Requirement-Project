<template>
    <lightning-card title="Enter Your Details">
        <div class="slds-p-around_medium">
            <lightning-input name="name" label="Name" value={name} onchange={handleInputChange}></lightning-input>
            <lightning-input name="email" type="email" label="Email" value={email}
                onchange={handleInputChange}></lightning-input>
            <lightning-input name="mobile" type="tel" label="Mobile" value={mobile}
                onchange={handleInputChange}></lightning-input>

            <div class="slds-m-top_medium slds-text-align_left">
                <lightning-button label="Next" variant="brand" onclick={handleNext}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
