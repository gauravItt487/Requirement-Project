<template>
    <lightning-card title="Order Details">
        <div class="slds-p-around_medium">
            <template if:true={order.data}>
                <lightning-layout vertical-align="center" class="slds-m-bottom_medium">
                    <lightning-layout-item size="12">
                        <p class="slds-text-heading_small">
                            <strong>Order Number:</strong> {number}
                        </p>
                    </lightning-layout-item>
                </lightning-layout>
            </template>

            <div class="slds-align_absolute-center">
                <lightning-button variant="brand" label="Next" onclick={handleNext}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
